name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Build
        run: go build ./...

      - name: Build for Windows
        run: GOOS=windows go build ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Unit tests
        run: go test -run TestNullTerminatorSize -count=1 -v .

  informix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Start Informix server
        run: make start-ifx

      - name: Build test image
        run: make build-ifx

      - name: Run Informix tests
        run: make test-ifx
